[config]
reload_apps = true

[templates.quickshell]
input_path = "templates/GeneratedColors.qml.in"
output_path = "~/.cache/enyxma-GeneratedColors.qml.next"

[templates.hyprland]
input_path = "templates/colors.lua.in"
output_path = "~/.config/hypr/colors.lua"

[templates.kitty]
input_path = "templates/kitty.conf.in"
output_path = "~/.config/kitty/kitty.conf"
post_hook = "pkill -USR1 -x kitty || true"

[templates.foot]
input_path = "templates/foot.ini.in"
output_path = "~/.config/foot/foot.ini"

[templates.gtk3]
input_path = "templates/gtk.css.in"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "templates/gtk.css.in"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.hyprlock]
input_path = "templates/hyprlock.conf.in"
output_path = "~/.config/hypr/hyprlock.conf"

[templates.starship]
input_path = "templates/starship.toml.in"
output_path = "~/.config/starship.toml"

[templates.btop]
input_path = "templates/btop.theme.in"
output_path = "~/.config/btop/themes/enyxma.theme"
post_hook = "pkill -USR2 -x btop >/dev/null 2>&1 || true"

[templates.yazi]
input_path = "templates/yazi-theme.toml.in"
output_path = "~/.config/yazi/theme.toml"
